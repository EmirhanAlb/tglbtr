<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel · __BRAND__</title>
  <link rel="stylesheet" href="panel.css" />
  <script src="config.js"></script>
</head>
<body class="panel-body">
  <div class="panel-shell">
    <aside class="panel-side">
      <a class="panel-side-brand" href="/">
        <img src="/images/blocks/tc-logo-white.png" alt="Trust Capital" />
      </a>
      <nav class="panel-side-nav" id="sideNav"></nav>
      <div class="panel-side-foot">
        <div class="panel-side-user">
          <div class="panel-side-avatar" id="userAvatar">—</div>
          <div class="panel-side-user-meta">
            <div class="panel-side-user-name" id="userName">—</div>
            <div class="panel-side-user-email" id="userEmail">—</div>
          </div>
        </div>
        <button type="button" class="panel-side-link" id="logoutBtn">
          <span>Çıkış</span>
        </button>
      </div>
    </aside>

    <main class="panel-main">
      <div class="panel-topbar">
        <button type="button" class="panel-mobile-toggle" id="mobileToggle" aria-label="Menü">☰</button>
        <div class="panel-topbar-sp"></div>
        <button type="button" class="panel-notif-btn" id="notifBtn" aria-label="Bildirimler">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="panel-notif-dot hidden" id="notifDot"></span>
        </button>
      </div>
      <div id="notifPanel" class="panel-notif-pop hidden"></div>
      <div id="view"></div>
    </main>
  </div>
  <div class="panel-side-scrim hidden" id="sideScrim"></div>

  <script type="module" src="panel.js"></script>
</body>
</html>
